<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cuestionario CaMir</title>
<style>
  :root{
    --bg:#f7f7f5; --card:#ffffff; --ink:#2b2b28; --muted:#6b6b64;
    --accent:#4a5d54; --accent-light:#e7ede9; --border:#e2e0da; --err:#a33d3d;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    line-height:1.5;
  }
  .wrap{max-width:680px; margin:0 auto; padding:32px 20px 80px;}
  header{margin-bottom:28px;}
  h1{font-size:1.4rem; margin:0 0 6px;}
  .sub{color:var(--muted); font-size:0.92rem;}
  .item{
    background:var(--card); border:1px solid var(--border); border-radius:10px;
    padding:18px 20px; margin-bottom:14px;
  }
  .item-n{font-size:0.78rem; color:var(--muted); margin-bottom:6px;}
  .item-text{margin:0 0 14px; font-size:1rem;}
  .opts{display:flex; flex-direction:column; gap:8px;}
  .opt{
    display:flex; align-items:center; gap:10px; padding:8px 10px;
    border-radius:7px; border:1px solid transparent; cursor:pointer;
  }
  .opt:hover{background:var(--accent-light);}
  .opt input{accent-color:var(--accent);}
  .opt.checked{background:var(--accent-light); border-color:var(--accent);}
  .opt span{font-size:0.94rem;}
  .missing{border-color:var(--err) !important;}
  .missing-note{color:var(--err); font-size:0.85rem; margin-top:6px; display:none;}
  .actions{position:sticky; bottom:0; background:linear-gradient(transparent, var(--bg) 40%); padding:20px 0 0;}
  button{
    width:100%; padding:14px; font-size:1rem; border:none; border-radius:10px;
    background:var(--accent); color:#fff; cursor:pointer;
  }
  button:disabled{opacity:0.55; cursor:not-allowed;}
  .status{text-align:center; margin-top:12px; font-size:0.9rem; color:var(--muted);}
  .done{
    max-width:520px; margin:120px auto; text-align:center; padding:0 20px;
  }
  .done h2{margin-bottom:10px;}
  .hidden{display:none !important;}
  .progress{
    position:sticky; top:0; z-index:5; height:4px; background:var(--border);
    margin-bottom:24px; border-radius:2px; overflow:hidden;
  }
  .progress-bar{height:100%; background:var(--accent); width:0%; transition:width .2s;}
</style>
</head>
<body>

<div class="wrap" id="formView">
  <div class="progress"><div class="progress-bar" id="progressBar"></div></div>
  <header>
    <h1>Cuestionario CaMir</h1>
    <p class="sub">Para cada frase, indique en qué medida se aplica a usted o a su experiencia. No hay respuestas correctas o incorrectas: responda con lo primero que le parezca al leer cada frase.</p>
  </header>

  <form id="camirForm"></form>

  <div class="actions">
    <button id="submitBtn" type="button">Enviar respuestas</button>
    <p class="status" id="statusMsg"></p>
  </div>
</div>

<div class="done hidden" id="doneView">
  <h2>Gracias</h2>
  <p>Revisaremos esto en la próxima sesión.</p>
</div>

<script>
/* ============================================================
   CONFIGURACIÓN
   ============================================================ */
const CONFIG = {

  INCLUIR_PROTOTIPOS: true // Producto 2: prototipos activos (ítem 50 excluido del cálculo, ver guía).

/* ============================================================

{id:70,texto:"Durante mi niñez, sufrí la indiferencia de mis seres queridos."},
{id:71,texto:"A menudo, me siento preocupado sin razón por la salud de mis seres queridos."}

const OPCIONES = [
  {valor:5, etiqueta:"Muy verdadero"},
  {valor:4, etiqueta:"Verdadero"},
  {valor:3, etiqueta:"Ni verdadero ni falso"},
  {valor:2, etiqueta:"Falso"},
  {valor:1, etiqueta:"Muy falso"}
];

// Asignación ítem -> escala (validada: 71 ítems, sin duplicados, versión chilena)
const ESCALAS = {
  A:{nombre:"Interferencia Parental", items:[7,35,39,48,54,62], norma:{m:2.52,de:0.63}},
  B:{nombre:"Preocupación Familiar", items:[20,22,32,56,68,71], norma:{m:3.32,de:0.81}},
  C:{nombre:"Resentimiento de Infantilización", items:[2,26,41,52,55,64], norma:{m:2.19,de:0.73}},
  D:{nombre:"Apoyo Parental", items:[9,21,40,53,58,66], norma:{m:3.89,de:0.74}},
  E:{nombre:"Apoyo Familiar", items:[1,4,18,27,36,69], norma:{m:3.82,de:0.71}},
  F:{nombre:"Reconocimiento de Apoyo", items:[6,10,11,19,25,28], norma:{m:4.05,de:0.65}},
  G:{nombre:"Indisponibilidad Parental", items:[15,29,30,31,38,70], norma:{m:2.35,de:0.73}},
  H:{nombre:"Distancia Familiar", items:[12,14,17], norma:{m:2.72,de:0.87}},
  I:{nombre:"Resentimiento de Rechazo", items:[13,47,50,57,60,67], norma:{m:1.99,de:0.83}},
  J:{nombre:"Traumatismo Parental", items:[3,33,45,59,61,63], norma:{m:1.96,de:0.83}},
  K:{nombre:"Bloqueo de Recuerdos", items:[37,46,51], norma:{m:2.16,de:0.87}},
  L:{nombre:"Dimisión Parental", items:[5,16,23,42,44], norma:{m:1.76,de:0.58}},
  M:{nombre:"Valoración de Jerarquía", items:[8,24,34,43,49,65], norma:{m:4.18,de:0.45}}
};

/* ============================================================
   MOTOR DE CÁLCULO (función pura — no toca el DOM)
   ============================================================ */
function calcularEscalas(respuestas){
  const resultado = {};
  for(const [letra, esc] of Object.entries(ESCALAS)){
    const valores = esc.items.map(id => respuestas[id]);
    const promedio = valores.reduce((a,b)=>a+b,0) / valores.length;
    const t = ((promedio - esc.norma.m) / esc.norma.de) * 10 + 50;
    resultado[letra] = {
      nombre: esc.nombre,
      promedio: Number(promedio.toFixed(2)),
      t: Number(t.toFixed(1)),
      t_redondeado: Math.round(t)
    };
  }
  return resultado;

/* ============================================================
   MOTOR DE PROTOTIPOS
   Excluye el ítem 50 del vector de correlación (70 de 71 ítems):
   su valor de patrón no está disponible en el Anexo II consultado.
   Ver guía de despliegue para el detalle metodológico.
   ============================================================ */
const PATRONES = {
 1:[4,1,1],2:[2,3,4],3:[2,4,3],4:[4,2,1],5:[1,3,3],6:[5,1,1],7:[3,4,5],8:[5,4,2],
 9:[5,2,1],10:[4,3,2],11:[5,5,2],12:[4,5,2],13:[2,2,5],14:[3,5,1],15:[2,4,3],
 16:[3,3,3],17:[3,5,1],18:[4,1,3],19:[5,5,2],20:[3,1,5],21:[4,3,2],22:[4,1,5],
 23:[3,4,2],24:[3,5,1],25:[4,2,2],26:[3,4,4],27:[5,1,5],28:[4,2,2],29:[2,4,4],
 30:[3,4,4],31:[3,4,4],32:[4,1,5],33:[2,3,3],34:[4,3,3],35:[3,5,4],36:[5,2,1],
 37:[3,5,2],38:[3,5,3],39:[2,2,5],40:[4,1,2],41:[3,2,5],42:[2,3,3],43:[5,2,3],
 44:[1,3,3],45:[1,3,3],46:[3,4,4],47:[1,2,3],48:[2,1,4],49:[5,2,4],51:[3,5,1],
 52:[2,2,5],53:[5,4,1],54:[2,3,4],55:[1,3,4],56:[3,1,5],57:[1,5,2],58:[5,3,1],
 59:[1,4,3],60:[1,2,4],61:[1,2,2],62:[2,4,4],63:[2,3,3],64:[2,3,4],65:[4,4,3],
 66:[5,2,3],67:[1,5,1],68:[3,1,5],69:[4,3,2],70:[1,3,2],71:[3,1,5]
};
const IDX = {seguro:0, rechazante:1, preocupado:2};
const TRANSFORM = {
  seguro:      {resta:.59, divide:.26},
  rechazante:  {resta:.13, divide:.15},
  preocupado:  {resta:.14, divide:.16}
};

function pearson(x, y){
  const n = x.length;
  const mx = x.reduce((a,b)=>a+b,0)/n;
  const my = y.reduce((a,b)=>a+b,0)/n;
  let num=0, dx2=0, dy2=0;
  for(let i=0;i<n;i++){
    const dx = x[i]-mx, dy = y[i]-my;
    num += dx*dy; dx2 += dx*dx; dy2 += dy*dy;
  }
  if(dx2 === 0 || dy2 === 0) return null;
  return num / Math.sqrt(dx2*dy2);
}

function calcularPrototipos(respuestas){
  const ids = Object.keys(PATRONES).map(Number);
  const vectorSujeto = ids.map(id => respuestas[id]);
  const resultado = {};
  for(const estilo of ["seguro","rechazante","preocupado"]){
    const vectorPatron = ids.map(id => PATRONES[id][IDX[estilo]]);
    const r = pearson(vectorSujeto, vectorPatron);
    const {resta, divide} = TRANSFORM[estilo];
    if(r === null){
      resultado[estilo] = { r: null, t: null, t_redondeado: null };
    } else {
      const t = ((r - resta)/divide)*10 + 50;
      resultado[estilo] = { r: Number(r.toFixed(3)), t: Number(t.toFixed(1)), t_redondeado: Math.round(t) };
    }
  }
  return resultado;
}

function clasificar(prototipos){
  if(prototipos.seguro.t_redondeado === null){
    return {
      reglaMaximo: "No calculable (respuestas sin variabilidad suficiente)",
      reglaPrioridadSeguro: "No calculable (respuestas sin variabilidad suficiente)"
    };
  }
  const vals = {
    seguro: prototipos.seguro.t_redondeado,
    rechazante: prototipos.rechazante.t_redondeado,
    preocupado: prototipos.preocupado.t_redondeado
  };
  const sobre60 = Object.entries(vals).filter(([k,v]) => v > 60);
  let reglaMaximo;
  if(sobre60.length >= 2){
    reglaMaximo = "Inclasificable (" + sobre60.map(x=>x[0]).join(" y ") + " ambos sobre 60)";
  } else {
    const max = Object.entries(vals).sort((a,b)=>b[1]-a[1])[0];
    reglaMaximo = max[0].charAt(0).toUpperCase()+max[0].slice(1) + " (T=" + max[1] + ")";
  }
  let reglaPrioridadSeguro;
  const inseguroSobre60 = vals.rechazante > 60 || vals.preocupado > 60;
  if(vals.seguro > 45 && !inseguroSobre60){
    reglaPrioridadSeguro = "Seguro (T=" + vals.seguro + ", regla de priorización)";
  } else {
    reglaPrioridadSeguro = "[Fallback no literal del manual] " + reglaMaximo;
  }
  return { reglaMaximo, reglaPrioridadSeguro };
}

/* ============================================================
   UI
   ============================================================ */
const form = document.getElementById("camirForm");
const respuestas = {};

ITEMS.forEach((item, idx) => {
  const div = document.createElement("div");
  div.className = "item";
  div.id = "item-" + item.id;

  const num = document.createElement("div");
  num.className = "item-n";
  num.textContent = (idx+1) + " / " + ITEMS.length;
  div.appendChild(num);

  const p = document.createElement("p");
  p.className = "item-text";
  p.textContent = item.texto;
  div.appendChild(p);

  const opts = document.createElement("div");
  opts.className = "opts";

  OPCIONES.forEach(op => {
    const label = document.createElement("label");
    label.className = "opt";
    const input = document.createElement("input");
    input.type = "radio";
    input.name = "item_" + item.id;
    input.value = op.valor;
    input.addEventListener("change", () => {
      respuestas[item.id] = op.valor;
      div.classList.remove("missing");
      const note = div.querySelector(".missing-note");
      if(note) note.style.display = "none";
      opts.querySelectorAll(".opt").forEach(o => o.classList.remove("checked"));
      label.classList.add("checked");
      actualizarProgreso();
    });
    const span = document.createElement("span");
    span.textContent = op.etiqueta;
    label.appendChild(input);
    label.appendChild(span);
    opts.appendChild(label);
  });

  div.appendChild(opts);

  const missingNote = document.createElement("p");
  missingNote.className = "missing-note";
  missingNote.textContent = "Falta responder esta frase.";
  div.appendChild(missingNote);

  form.appendChild(div);
});

function actualizarProgreso(){
  const pct = Math.round((Object.keys(respuestas).length / ITEMS.length) * 100);
  document.getElementById("progressBar").style.width = pct + "%";
}

function obtenerIdPaciente(){
  const params = new URLSearchParams(window.location.search);
  return params.get("id") || "sin-identificar";
}

document.getElementById("submitBtn").addEventListener("click", async () => {
  const faltantes = ITEMS.filter(i => respuestas[i.id] === undefined);
  if(faltantes.length > 0){
    faltantes.forEach(i => {
      const div = document.getElementById("item-" + i.id);
      div.classList.add("missing");
      div.querySelector(".missing-note").style.display = "block";
    });
    document.getElementById(faltantes[0].id ? "item-"+faltantes[0].id : "").scrollIntoView({behavior:"smooth", block:"center"});
    document.getElementById("statusMsg").textContent =
      "Faltan " + faltantes.length + " frase(s) por responder.";
    return;
  }

  const btn = document.getElementById("submitBtn");
  btn.disabled = true;
  document.getElementById("statusMsg").textContent = "Enviando…";

   const escalas = calcularEscalas(respuestas);
  const payload = {
    id: obtenerIdPaciente(),
    fecha: new Date().toISOString(),
    incluyePrototipos: CONFIG.INCLUIR_PROTOTIPOS,
    escalas: escalas,
    respuestasCrudas: respuestas
  };
  if(CONFIG.INCLUIR_PROTOTIPOS){
    const prototipos = calcularPrototipos(respuestas);
    payload.prototipos = prototipos;
    payload.clasificacion = clasificar(prototipos);
  }

  try{
    const res = await fetch(CONFIG.APPS_SCRIPT_URL, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"}, // evita preflight CORS
      body: JSON.stringify(payload)
    });
    const data = await res.json().catch(() => null);
    if(data && data.ok){
      mostrarPantallaFinal();
    } else {
      throw new Error("Respuesta inesperada del servidor");
    }
  }catch(err){
    document.getElementById("statusMsg").textContent =
      "No se pudo enviar. Verifique su conexión e intente nuevamente.";
    btn.disabled = false;
  }
});

function mostrarPantallaFinal(){
  document.getElementById("formView").classList.add("hidden");
  document.getElementById("doneView").classList.remove("hidden");
}
</script>
</body>
</html>
